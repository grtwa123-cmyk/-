<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="pageTitle">Science Lab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">English</button>
      <button type="button" class="lang-btn" data-lang="ko" aria-pressed="false">한국어</button>
      <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
    </div>

    <header class="site-header">
      <h1 data-i18n="heroTitle">Science Lab</h1>
      <p data-i18n="heroSubtitle">Pick a discipline to begin.</p>
    </header>

    <main class="category-grid">
      <a class="category-card physics" href="physics.html">
        <div class="category-icon" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="26" height="2.6" rx="0.5" />
            <line x1="6" y1="7.6" x2="6" y2="19" />
            <line x1="11" y1="7.6" x2="11" y2="19" />
            <line x1="16" y1="7.6" x2="16" y2="19" />
            <line x1="21" y1="7.6" x2="21" y2="19" />
            <line x1="26" y1="7.6" x2="26" y2="19" />
            <circle cx="6" cy="22" r="2.5" />
            <circle cx="11" cy="22" r="2.5" />
            <circle cx="16" cy="22" r="2.5" />
            <circle cx="21" cy="22" r="2.5" />
            <circle cx="26" cy="22" r="2.5" />
          </svg>
        </div>
        <h2 data-i18n="categoryPhysics">Physics</h2>
        <p class="tagline" data-i18n="physicsTagline">Motion, forces, waves.</p>
        <p class="description" data-i18n="physicsLandingDesc">Throw a projectile, swing a pendulum, watch waves interfere.</p>
        <span class="cta" data-i18n="exploreCta">Explore</span>
      </a>

      <a class="category-card chemistry" href="chemistry.html">
        <div class="category-icon" aria-hidden="true">
          <svg width="44" height="44" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="11" y1="4" x2="21" y2="4" />
            <path d="M 12 4 L 12 12 L 5 24 Q 5 28 9 28 L 23 28 Q 27 28 27 24 L 20 12 L 20 4" />
            <circle cx="11" cy="23" r="1" />
            <circle cx="17" cy="20.5" r="0.85" />
            <circle cx="14.5" cy="25.5" r="1.2" />
          </svg>
        </div>
        <h2 data-i18n="categoryChemistry">Chemistry</h2>
        <p class="tagline" data-i18n="chemistryTagline">Atoms, bonds, structure.</p>
        <p class="description" data-i18n="chemistryLandingDesc">Explore molecular structure and the regularities of matter.</p>
        <span class="cta" data-i18n="exploreCta">Explore</span>
      </a>
    </main>
  </div>

  <script src="i18n.js"></script>
</body>
</html>
