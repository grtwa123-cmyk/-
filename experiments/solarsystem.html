<title data-i18n="ssPageTitle">Solar System Tour · Science Lab</title>
<style>
  /* Pretendard (SIL OFL 1.1) — see assets/fonts/OFL.txt and the note in
     styles.css. Self-hosted and subset so the Korean face is the same one
     on every platform, and cut in two along the Hangul blocks so a reader who
     renders no Hangul fetches 59 KB instead of 459 KB. */
  @font-face {
    font-family: "Pretendard Variable";
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url("../assets/fonts/PretendardVariable.latin.woff2") format("woff2-variations");
    unicode-range: U+0-10FF, U+1200-312F, U+3190-A95F, U+A980-ABFF, U+D800-10FFFF;
  }
  @font-face {
    font-family: "Pretendard Variable";
    font-weight: 45 920;
    font-style: normal;
    font-display: swap;
    src: url("../assets/fonts/PretendardVariable.hangul.woff2") format("woff2-variations");
    unicode-range: U+1100-11FF, U+3130-318F, U+A960-A97F, U+AC00-D7FF;
  }

  :root{
    --bg:#04060d;
    --panel:rgba(12,16,30,.88);
    --line:rgba(148,168,220,.16);
    --ink:#e9edf8;
    --dim:#94a0bd;
    --mono:ui-monospace,'SF Mono','Cascadia Mono','Consolas',monospace;
    --sans:'Pretendard Variable',Pretendard,system-ui,-apple-system,'Segoe UI','Apple SD Gothic Neo','Noto Sans KR','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
  #stage{position:fixed;inset:0;touch-action:none}
  canvas{display:block}

  /* ── 로딩 ─────────────────────────── */
  #loading{
    position:fixed;inset:0;z-index:50;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.1em;
  }
  .spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:#8fb4ff;animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* ── 상단 바 ───────────────────────── */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    pointer-events:none;
    background:linear-gradient(to bottom,rgba(4,6,13,.85),rgba(4,6,13,0));
  }
  .eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
  .topbar h1{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-top:3px}
  .topbar .sub{font-size:11px;color:var(--dim);margin-top:3px}
  .telemetry{text-align:right;font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.7}
  .telemetry b{color:var(--ink);font-weight:600}

  /* ── 하단 도크 ─────────────────────── */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:10;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
    background:linear-gradient(to top,rgba(4,6,13,.9),rgba(4,6,13,0));
  }
  .ctrl-row{display:flex;align-items:center;gap:8px}
  .btn{
    font-family:var(--mono);font-size:12px;color:var(--ink);
    background:rgba(20,26,46,.75);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.96)}
  .btn:focus-visible,.chip:focus-visible{outline:2px solid #8fb4ff;outline-offset:2px}
  #speed{flex:1;min-width:60px;accent-color:#aab6dd;height:24px}
  #spdLab{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:46px;text-align:right}

  .chip-rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .chip-rail::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;font-size:12px;font-weight:600;color:var(--ink);
    background:rgba(20,26,46,.75);border:1px solid var(--line);
    border-radius:999px;padding:7px 13px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .chip.on{color:#04060d;border-color:transparent}

  /* ── 관측 카드 (정보 패널) ──────────── */
  .panel{
    position:fixed;z-index:20;left:0;right:0;bottom:0;
    max-height:56vh;overflow-y:auto;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(112%);transition:transform .38s cubic-bezier(.32,.72,.25,1);
  }
  .panel.open{transform:translateY(0)}
  .p-head{display:flex;align-items:flex-start;gap:10px}
  .p-bar{width:4px;align-self:stretch;border-radius:2px;background:#888}
  .p-title{flex:1}
  .p-title h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
  #pClose{margin-left:auto}
  .p-desc{font-size:13px;line-height:1.65;color:var(--dim);margin:10px 0 12px}

  .grid{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .cell{background:rgba(10,14,26,.92);padding:9px 11px}
  .cell dt{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .cell dd{font-family:var(--mono);font-size:12.5px;color:var(--ink);margin-top:4px;line-height:1.45;word-break:keep-all}

  .cmp{margin-top:12px}
  .cmp .track{height:8px;border-radius:4px;background:rgba(148,168,220,.14);overflow:hidden}
  .cmp .fill{height:100%;border-radius:4px;width:0%;transition:width .5s ease}
  .cmp .cap{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
  .cmp .cap b{color:var(--ink)}

  /* ── 데스크톱 ─────────────────────── */
  @media (min-width:900px){
    .panel{
      left:auto;right:16px;top:16px;bottom:16px;width:380px;max-height:none;
      border:1px solid var(--line);border-radius:18px;
      transform:translateX(118%);
    }
    .panel.open{transform:translateX(0)}
    .dock{align-items:center}
    .ctrl-row,.chip-rail{width:min(720px,94vw)}
  }
  @media (prefers-reduced-motion:reduce){
    .panel{transition:none}
    /* This page does not link styles.css, so the site-wide rule there that
       flattens every CSS animation never reached it, and the loading spinner
       turned right through the preference — measured at 0.1 rad in one frame
       and 2.1 the next. It is the only thing on screen for as long as
       three.js takes to arrive, and forever if it never does. */
    .spin{animation:none}
  }

  /* ── 사이트 헤더 통합 (Back + 버전) ──────── */
  .site-overlay{
    /* Above #loading (z 50): while the scene is still building, and above all
       when it has failed to build, Back and the language buttons have to stay
       reachable — a failure notice the reader cannot translate is no use. */
    position:fixed;z-index:60;
    top:calc(8px + env(safe-area-inset-top));left:14px;
    display:flex;align-items:center;gap:.55rem;
  }
  .site-overlay a{
    color:#8fb4ff;text-decoration:none;font-family:var(--mono);font-size:11px;
    letter-spacing:.04em;
  }
  .site-overlay a:hover{text-decoration:underline}
  .method-tag{
    padding:.14rem .5rem;font-size:.68rem;font-weight:600;
    border-radius:999px;border:1px solid rgba(90,150,230,.32);
    color:#8fc0f5;background:rgba(90,150,230,.14);
    letter-spacing:.02em;cursor:help;
  }
  .site-overlay .version-tag{
    padding:.1rem .5rem;font-size:.7rem;font-weight:600;
    color:var(--dim);background:rgba(20,26,46,.78);
    border:1px solid var(--line);border-radius:999px;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
  }
  /* The Back / version / language row is pinned over the top-left corner, so
     the topbar's own column starts below it rather than under it. */
  .topbar > div:first-child{margin-top:30px}

  /* ── 언어 전환 ─────────────────────
     This page is full-bleed, so it cannot use the shared .lang-switch from
     styles.css. It rides in the top-left row rather than the opposite corner,
     because on desktop the observation card owns the whole right edge and
     would sit on top of it. */
  .lang-switch{display:flex;gap:.3rem;margin-left:.2rem}
  .lang-switch .lang-btn{
    padding:.16rem .5rem;font-family:var(--mono);font-size:10px;letter-spacing:.04em;
    color:var(--dim);background:rgba(20,26,46,.78);
    border:1px solid var(--line);border-radius:999px;cursor:pointer;
  }
  .lang-switch .lang-btn:hover{color:var(--ink)}
  .lang-switch .lang-btn.active{color:#0b1020;background:#8fb4ff;border-color:#8fb4ff}
</style>
  <!-- Blocking on purpose: this stamps the theme on <html> before the
       first paint, so navigating never flashes the wrong one. -->
  <script src="../assets/theme.js"></script>
  <script src="../assets/offline.js" defer></script>
</head>
<body>
  <noscript>
    <style>
      .noscript-note {
        position: relative; z-index: 99; margin: 0; padding: 1rem 1.2rem;
        background: #151a2e; color: #ecf0fb; border-bottom: 1px solid #2a3150;
        font: 15px/1.6 system-ui, sans-serif;
      }
      .noscript-note a { color: #6ea8ff; }
    </style>
    <p class="noscript-note">This page is rendered with WebGL and driven by

  </noscript>

<div class="site-overlay">
  <a href="../physics.html" data-i18n="backToHub">&larr; Back</a>
  <span class="version-tag">v2.0.0</span><span class="method-tag" data-method="model" data-i18n="methodModel" data-i18n-title="methodModelWhy" title="">Real data</span><span class="method-verified" data-i18n="methodVerified" data-i18n-title="methodVerifiedWhy" title="">Verified</span>
  <span class="lang-switch" role="group" aria-label="Language">
    <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>

  </span>
</div>

<div id="stage"></div>

<div id="loading"><div class="spin"></div><div id="loadingCap" data-i18n="ssLoading">Generating planet surfaces&hellip;</div></div>

  <script src="../assets/reduced-motion.js" defer></script>
<script>
  // This page needs three.js from a CDN. If the CDN is blocked (offline,
  // strict firewall, corporate proxy) the spinner would otherwise sit on
  // "Generating planet surfaces…" forever with no way out — the same dead
  // end the landing wall used to have. Say so and offer the way back.
  //
  // The dictionary may not have arrived yet when this runs, so every string
  // is re-read on `langchange` as well.
  window.solarLoadFailed = function () {
    var el = document.getElementById("loading");
    if (!el || el.classList.contains("done") || document.querySelector("#stage canvas")) return;
    var t = function (k, fallback) {
      return (window.i18n && window.i18n.t(k)) || fallback;
    };
    el.innerHTML =
      '<div style="text-align:center;line-height:1.7">' +
      '<div style="font-size:15px;margin-bottom:10px" data-i18n="ssFailTitle">' +
        t("ssFailTitle", "The 3D view could not load") + "</div>" +
      '<div style="font-size:12px;opacity:.7;margin-bottom:14px" data-i18n="ssFailBody">' +
        t("ssFailBody", "three.js did not arrive from the CDN. Check the network connection.") + "</div>" +
      '<div style="display:flex;gap:14px;justify-content:center;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase">' +
      '<a href="../physics.html" style="color:#8cbaff" data-i18n="physicsHubTitle">' + t("physicsHubTitle", "Physics") + "</a>" +
      '<a href="../index.html" style="color:#8cbaff" data-i18n="ssNavHome">' + t("ssNavHome", "Home") + "</a>" +
      '<a href="solar.html" style="color:#8cbaff" data-i18n="ss2D">' + t("ss2D", "2D solar system") + "</a>" +
      "</div></div>";
  };
  // Belt and braces: the load may also fail slowly rather than outright.
  setTimeout(window.solarLoadFailed, 8000);
</script>

<header class="topbar">
  <div>
    <div class="eyebrow" data-i18n="ssEyebrow">Solar System &middot; Live Orbit</div>
    <h1 data-i18n="ssTitle">Solar System Simulator</h1>
    <div class="sub" data-i18n="ssSub">Drag to turn &middot; wheel / pinch to zoom &middot; tap a planet for its card</div>
  </div>
  <div class="telemetry">
    <div><span data-i18n="ssElapsed">Elapsed</span> <b id="tDays">0 d</b></div>
    <div><span data-i18n="ssRate">Rate</span> <b id="tSpeed">&times;1.0</b></div>
  </div>
</header>

<div class="dock">
  <div class="ctrl-row">
    <button type="button" class="btn" id="pauseBtn"
            aria-label="Pause" data-i18n-aria="ssPauseAria">&#9208; Pause</button>
    <input type="range" id="speed" min="0" max="100" value="50"
           aria-label="Time rate" data-i18n-aria="ssSpeedAria">
    <span id="spdLab">&times;1.0</span>
    <button type="button" class="btn" id="labelBtn" data-i18n="ssLabels">Labels</button>
    <button type="button" class="btn" id="resetBtn" data-i18n="ssOverview">Overview</button>
  </div>
  <div class="chip-rail" id="chips"></div>
</div>

<aside class="panel" id="panel" aria-live="polite">
  <div class="p-head">
    <div class="p-bar" id="pBar"></div>
    <div class="p-title">
      <div class="eyebrow"><span data-i18n="ssCard">Observation Card</span> &middot; <span id="pEn">EARTH</span></div>
      <h2 id="pName">Earth</h2>
    </div>
    <button type="button" class="btn" id="pClose" data-i18n="ssClose">Close &#10005;</button>
  </div>
  <p class="p-desc" id="pDesc"></p>
  <dl class="grid" id="pGrid"></dl>
  <div class="cmp">
    <div class="track"><div class="fill" id="cmpFill"></div></div>
    <div class="cap" id="cmpCap"></div>
  </div>
</aside>

<script src="../i18n.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="solarsystem.js"></script>
<script src="../assets/url-state.js" defer></script>
<script src="../assets/sfx.js" defer></script>
<script>
  // A very quiet deep-space pad, started on the first gesture (so it obeys
  // the browser's autoplay policy) and mutable via the 🔊 toggle.
  window.addEventListener("pointerdown", function () {
    if (window.SFX && !window.__ambientDrone) {
      window.__ambientDrone = new window.SFX.Drone({ type: "sine", freq: 55, gain: 0.022, partials: 1 });
    }
  }, { once: true });
</script>
