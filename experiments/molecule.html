<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0f1e" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f6fc" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Browse common molecules — atoms, bonds, geometry, and the patterns they reveal across matter." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Molecule Viewer · Science Experiments" />
  <meta property="og:description" content="Browse common molecules — atoms, bonds, geometry, and the patterns they reveal across matter." />
  <meta property="og:url" content="https://grtwa123-cmyk.github.io/-/experiments/molecule.html" />
  <meta property="og:image" content="https://grtwa123-cmyk.github.io/-/assets/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:image" content="https://grtwa123-cmyk.github.io/-/assets/og-cover.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'&gt;&lt;rect width='64' height='64' rx='12' fill='%230b0f1e'/&gt;&lt;circle cx='32' cy='32' r='18' fill='none' stroke='%23c47bff' stroke-width='3'/&gt;&lt;circle cx='32' cy='32' r='4' fill='%23c47bff'/&gt;&lt;/svg&gt;" />
  <title data-i18n="moleculePageTitle">Molecule Viewer · Science Experiments</title>
  <!-- Blocking on purpose: this stamps the theme on <html> before the
       first paint, so navigating never flashes the wrong one. -->
  <script src="../assets/theme.js"></script>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-theme="chemistry">
  <div class="container">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en" aria-pressed="true">English</button>
      <button type="button" class="lang-btn" data-lang="ko" aria-pressed="false">한국어</button>
      <button type="button" class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
    </div>

    <div class="crumbs">
      <a href="../chemistry.html" data-i18n="backToHub">&larr; Back</a>
      <span><span style="color: var(--muted); font-size: 0.9rem;" data-i18n="experimentCount3">Chemistry experiment</span><span class="version-tag">v1.0.0</span><span class="method-tag" data-method="model" data-i18n="methodModel" data-i18n-title="methodModelWhy" title="">Real data</span></span>
    </div>

    <header class="site-header">
      <h1 data-i18n="moleculeTitle">Molecule Viewer</h1>
      <p data-i18n="moleculeIntro">Pick a molecule and rotate it. Notice how molecules with the same hybridization share a geometric template.</p>
    </header>

    <main class="experiment">
      <section class="panel" aria-label="Controls">
        <h2 data-i18n="selectMolecule">Molecule</h2>

        <div class="molecule-list" id="molecule-list" role="listbox"></div>

        <div class="control" style="margin-top: 1rem;">
          <label for="rotate-toggle" data-i18n="rotateLabel">Auto rotate</label>
          <span class="value">
            <input type="checkbox" id="rotate-toggle" checked />
          </span>
        </div>

        <div class="control">
          <label for="rotate-speed" data-i18n="rotationSpeed">Rotation</label>
          <span class="value"><span id="rotate-speed-value">0.40</span></span>
          <input type="range" id="rotate-speed" min="0" max="2" step="0.05" value="0.40" />
        </div>

        <div class="control">
          <label for="labels-toggle" data-i18n="showLabelsLabel">Show element symbols</label>
          <span class="value">
            <input type="checkbox" id="labels-toggle" checked />
          </span>
        </div>

        <div class="property-list">
          <div class="property"><span class="property-label" data-i18n="propertyName">Name</span><span class="property-value" id="prop-name">—</span></div>
          <div class="property"><span class="property-label" data-i18n="propertyFormula">Formula</span><span class="property-value" id="prop-formula">—</span></div>
          <div class="property"><span class="property-label" data-i18n="propertyGeometry">Geometry</span><span class="property-value" id="prop-geometry">—</span></div>
          <div class="property"><span class="property-label" data-i18n="propertyBondAngle">Bond angle</span><span class="property-value" id="prop-angle">—</span></div>
          <div class="property"><span class="property-label" data-i18n="propertyHybridization">Hybridization</span><span class="property-value" id="prop-hybrid">—</span></div>
          <div class="property"><span class="property-label" data-i18n="propertyAtomCount">Atom count</span><span class="property-value" id="prop-count">—</span></div>
        </div>

        <details class="formulas" open>
          <summary data-i18n="patternNote">Pattern</summary>
          <p id="pattern-body" style="margin: 0.6rem 0 0; color: var(--muted); font-size: 0.92rem;">—</p>
        </details>
      </section>

      <section class="stage" aria-label="Visualisation">
        <div class="stage-3d">
          <canvas id="stage" width="800" height="500" aria-label="Interactive 3D model of the selected molecule — drag to rotate, scroll to zoom"></canvas>
          <canvas id="overlay" class="overlay-2d" aria-hidden="true"></canvas>
          <p class="hint-3d" data-i18n="hint3d">Drag to rotate · scroll to zoom</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../i18n.js" defer></script>
  <script src="../assets/sfx.js" defer></script>
  <script src="../assets/gl3d.js" defer></script>
  <script src="../assets/reduced-motion.js" defer></script>
  <script src="../assets/url-state.js" defer></script>
  <script src="molecule.js" defer></script>
</body>
</html>
