  <script>
    // GitHub Pages serves this page for ANY missing path — including nested
    // ones like /repo/experiments/nope.html — where relative URLs would
    // resolve against the wrong directory (broken stylesheet + links).
    // Anchor every relative URL to the site root instead. On a project
    // page the first path segment is the repo name; on a user/org page
    // (or a local server at the root) the site root is "/".
    (function () {
      var seg = location.pathname.split("/")[1];
      var base = document.createElement("base");
      base.href = (seg && seg.indexOf(".") === -1) ? "/" + seg + "/" : "/";
      document.head.appendChild(base);
    })();
  </script>
  <!-- Blocking on purpose: this stamps the theme on <html> before the
       first paint, so navigating never flashes the wrong one. -->
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
