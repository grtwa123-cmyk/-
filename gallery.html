<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Spherical Gallery</title>
  <link rel="preconnect" href="https://picsum.photos" />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <style>
    :root{
      --bg:#0a0a0d;
      --ink:#f3f1ea;
      --dim:#8a8a93;
      --mono:ui-monospace,'SF Mono','Cascadia Mono',Consolas,monospace;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans)}
    body{cursor:none}
    @media (pointer:coarse){ body{cursor:auto} }
    #scene{position:fixed;inset:0;touch-action:none}
    canvas{display:block}

    /* 비네트 + 필름 그레인 분위기 */
    .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
      background:radial-gradient(120% 120% at 50% 50%,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 78%,rgba(0,0,0,.9) 100%);}

    /* ── HUD ── */
    .hud{position:fixed;z-index:5;pointer-events:none;
      font-family:var(--mono);letter-spacing:.04em;}
    .hud.tl{top:calc(20px + env(safe-area-inset-top));left:24px}
    .hud.tl .mark{font-size:13px;font-weight:600;letter-spacing:.18em}
    .hud.tl .sub{font-size:10px;color:var(--dim);margin-top:6px;text-transform:uppercase;letter-spacing:.22em}
    .hud.tr{top:calc(20px + env(safe-area-inset-top));right:24px;text-align:right;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.2em;line-height:1.9}
    .hud.tr b{color:var(--ink);font-weight:600}
    .hud.bc{bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
      font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.26em;
      transition:opacity .6s ease}
    .back-site{position:fixed;z-index:5;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
      font-family:var(--mono);font-size:10px;color:var(--dim);text-decoration:none;letter-spacing:.16em;
      text-transform:uppercase;opacity:.6;transition:opacity .3s}
    .back-site:hover{opacity:1}

    /* ── 커스텀 커서 ── */
    .cursor{position:fixed;z-index:30;top:0;left:0;width:34px;height:34px;border:1px solid rgba(243,241,234,.7);
      border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;mix-blend-mode:difference;
      transition:width .25s ease,height .25s ease,background .25s ease,border-color .25s ease;will-change:transform}
    .cursor.hot{width:74px;height:74px;background:rgba(243,241,234,.12);border-color:rgba(243,241,234,0)}
    .cursor .lbl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:0;transition:opacity .25s}
    .cursor.hot .lbl{opacity:1}
    @media (pointer:coarse){ .cursor{display:none} }

    /* ── 로딩 ── */
    #loader{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;
      flex-direction:column;gap:18px;transition:opacity .8s ease}
    #loader.gone{opacity:0;pointer-events:none}
    #loader .num{font-family:var(--mono);font-size:46px;font-weight:300;letter-spacing:.02em}
    #loader .cap{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.3em;text-transform:uppercase}

    /* ── 상세 페이지 ── */
    #detail{position:fixed;inset:0;z-index:20;display:none;}
    #detail .bg{position:absolute;inset:0;background:rgba(8,8,11,.0);backdrop-filter:blur(0px);}
    #hero{position:fixed;overflow:hidden;border-radius:16px;z-index:21;will-change:transform,width,height,left,top;
      box-shadow:0 40px 120px rgba(0,0,0,.6)}
    #hero img{width:100%;height:100%;object-fit:cover;display:block}
    #hero .shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,11,.92) 0%,rgba(8,8,11,.3) 42%,rgba(8,8,11,0) 70%)}
    #meta{position:fixed;z-index:22;left:50%;bottom:0;transform:translateX(-50%);
      width:min(86vw,880px);padding:0 6px calc(48px + env(safe-area-inset-bottom));pointer-events:none}
    #meta .cat{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
    #meta h2{font-size:clamp(30px,6vw,60px);font-weight:600;letter-spacing:-.02em;line-height:1.02;margin:12px 0 14px}
    #meta p{font-size:14px;line-height:1.7;color:#cfccc3;max-width:54ch}
    #meta .row{display:flex;gap:26px;margin-top:18px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em}
    #meta .row b{color:var(--ink);font-weight:600;margin-left:8px}
    #close{position:fixed;z-index:23;top:calc(22px + env(safe-area-inset-top));right:24px;
      font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
      background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:999px;
      padding:10px 18px;cursor:pointer;opacity:0}
    #close:hover{background:rgba(255,255,255,.14)}
    .ln{display:block;overflow:hidden}
    .ln > span{display:block}
  </style>
</head>
<body>
  <a class="back-site" href="index.html">&larr; Index</a>

  <div id="scene"></div>
  <div class="vignette"></div>

  <div class="hud tl">
    <div class="mark">◇ PHANTOM</div>
    <div class="sub">Spherical Gallery</div>
  </div>
  <div class="hud tr">
    <div>Pieces <b id="count">—</b></div>
    <div>In view <b id="focus">—</b></div>
  </div>
  <div class="hud bc" id="hint">Drag to explore · Click a piece to open</div>

  <!-- 커스텀 커서 -->
  <div class="cursor" id="cursor"><span class="lbl">Open</span></div>

  <!-- 상세 페이지 (기본 템플릿) -->
  <div id="detail">
    <div class="bg"></div>
    <div id="hero"><img alt="" /><div class="shade"></div></div>
    <div id="meta">
      <div class="cat"></div>
      <h2></h2>
      <p></p>
      <div class="row"><span>Year<b class="y"></b></span><span>Medium<b class="m"></b></span><span>Ref<b class="r"></b></span></div>
    </div>
    <button id="close">Close ✕</button>
  </div>

  <div id="loader">
    <div class="num" id="ldNum">0%</div>
    <div class="cap">Assembling the sphere</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    const gsap = window.gsap;

    /* ======================================================================
       구 안쪽 갤러리
       - 카드(이미지 평면)들을 반지름 R의 구면에 '안쪽을 향해' 배치한다.
       - 카메라는 구의 중심(원점)에 고정. 카드 그룹 전체를 회전시켜 둘러본다.
       - 드래그 → 회전, 놓으면 관성(lenis 느낌)으로 감속, 평소엔 아주 느린 드리프트.
       - 카드 클릭 → 그 카드의 화면 위치/크기에서 시작해 GSAP로 확대되는 상세 페이지.
       ====================================================================== */

    // ── 튜닝 상수 ──
    const R = 9;            // 구 반지름
    const CARD_W = 2.4;     // 카드 가로 (월드)
    const CARD_H = 3.2;     // 카드 세로 (3:4 세로형)
    const N = 32;           // 카드 수
    const DRAG_K = 0.0052;  // 드래그 → 회전 감도
    const EASE = 0.09;      // 현재값이 목표값을 따라가는 부드러움 (작을수록 느긋)
    const FRICTION = 0.94;  // 관성 감속
    const DRIFT = 0.00075;  // 자동 드리프트(가로)
    const PITCH_LIMIT = 0.92; // 위/아래 회전 제한(라디안) — 극점 넘어가 뒤집히는 것 방지

    // ── 작품 메타데이터 (이미지는 picsum 시드로 안정적으로 로드) ──
    const TITLES = [
      "Drift","Umbra","Solstice","Vellum","Cinder","Halcyon","Tessellate","Mirage",
      "Quietus","Lithic","Aether","Penumbra","Foray","Verdigris","Nocturne","Selenite",
      "Cascade","Ravel","Glimmer","Threnody","Ossein","Fathom","Saudade","Ember",
      "Liminal","Cathode","Reverie","Strata","Vesper","Helix","Anodyne","Wane",
    ];
    const CATS = ["Photogram","Sculpture","Field Study","Long Exposure","Cyanotype","Pigment","Generative","Archive"];
    const MEDIA = ["Silver gelatin","Resin · steel","Inkjet","C-print","Cyanotype","Oil on linen","Code","Mixed"];
    const ITEMS = Array.from({length:N}, (_,i)=>({
      title: TITLES[i % TITLES.length],
      cat: CATS[i % CATS.length],
      medium: MEDIA[i % MEDIA.length],
      year: 1998 + ((i*7) % 27),
      ref: "PH-" + String(101 + i),
      seed: "ph" + (i+3),
      url: `https://picsum.photos/seed/ph${i+3}/600/800`,
      hi:  `https://picsum.photos/seed/ph${i+3}/1200/1600`,
    }));

    /* ── 렌더러 / 씬 / 카메라 ── */
    const host = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    renderer.setSize(innerWidth, innerHeight);
    host.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a0a0d, 0.018);
    const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
    camera.position.set(0,0,0);     // 구의 중심
    const FORWARD = new THREE.Vector3(0,0,-1);  // 기본 시선 방향

    const group = new THREE.Group();
    group.rotation.order = 'YXZ';   // yaw 먼저, 그다음 pitch → 자연스러운 카메라 느낌
    scene.add(group);

    /* ── 피보나치 구면 분포: N개 점을 구면에 고르게 ── */
    function fibSphere(n, radius){
      const pts = [], phi = Math.PI*(3 - Math.sqrt(5)); // 황금각
      for(let i=0;i<n;i++){
        const y = 1 - (i/(n-1))*2;          // 1 → -1
        const rad = Math.sqrt(1 - y*y);
        const th = phi*i;
        pts.push(new THREE.Vector3(Math.cos(th)*rad, y, Math.sin(th)*rad).multiplyScalar(radius));
      }
      return pts;
    }

    /* ── 카드 생성 ── */
    const geo = new THREE.PlaneGeometry(CARD_W, CARD_H);
    const cards = [];
    const positions = fibSphere(N, R);
    const manager = new THREE.LoadingManager();
    const loader = new THREE.TextureLoader(manager);

    positions.forEach((p, i)=>{
      const tex = loader.load(ITEMS[i].url);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      // DoubleSide: lookAt 방향에 상관없이 항상 앞면 텍스처가 보이도록
      const mat = new THREE.MeshBasicMaterial({ map:tex, side:THREE.DoubleSide, transparent:true, opacity:1, fog:true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(p);
      mesh.lookAt(0,0,0);            // 카드가 구의 중심(=카메라)을 바라보게
      mesh.userData = { item: ITEMS[i], dir: p.clone().normalize(), baseScale:1 };
      group.add(mesh);
      cards.push(mesh);
    });

    /* ── 회전 상태 (목표/현재/속도) ── */
    const rot = { tRx:0, tRy:0, cRx:0, cRy:0, vRx:0, vRy:0 };
    const clamp = (v,a,b)=> v<a?a : v>b?b : v;

    /* ── 포인터: 드래그 회전 + 클릭 판별 ── */
    const el = renderer.domElement;
    const pointers = new Map();
    let dragging=false, down=null, pinch=0, locked=false; // locked: 상세 열림 동안 입력 차단

    el.addEventListener('pointerdown', e=>{
      if(locked) return;
      el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===1){ dragging=true; down={x:e.clientX,y:e.clientY,moved:0,t:performance.now()}; }
      if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y); }
    });
    el.addEventListener('pointermove', e=>{
      const pt = pointers.get(e.pointerId);
      if(pt){ // 회전/핀치 처리
        const dx=e.clientX-pt.x, dy=e.clientY-pt.y; pt.x=e.clientX; pt.y=e.clientY;
        if(pointers.size===1 && dragging){
          if(down) down.moved += Math.abs(dx)+Math.abs(dy);
          rot.tRy += dx*DRAG_K;
          rot.tRx = clamp(rot.tRx + dy*DRAG_K, -PITCH_LIMIT, PITCH_LIMIT);
          rot.vRy = dx*DRAG_K; rot.vRx = dy*DRAG_K;   // 놓을 때 쓸 관성
        } else if(pointers.size===2){
          const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
          if(pinch>0){ camera.fov = clamp(camera.fov * pinch/d, 42, 92); camera.updateProjectionMatrix(); }
          pinch=d;
        }
      }
      // 커서 위치
      cursor.style.transform = `translate(${e.clientX}px,${e.clientY}px)`;
      cursorPos.x = e.clientX; cursorPos.y = e.clientY;
    });
    function up(e){
      pointers.delete(e.pointerId);
      if(pointers.size<2) pinch=0;
      if(pointers.size===0) dragging=false;
      if(down && !locked && down.moved<6 && performance.now()-down.t<500){ tryOpen(down.x, down.y); }
      down=null;
    }
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); dragging=false; down=null; });
    el.addEventListener('wheel', e=>{ e.preventDefault();
      camera.fov = clamp(camera.fov + e.deltaY*0.02, 42, 92); camera.updateProjectionMatrix();
    }, { passive:false });

    /* ── 레이캐스트: 호버 & 클릭 대상 ── */
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    function pickAt(x,y){
      ndc.set(x/innerWidth*2-1, -(y/innerHeight)*2+1);
      ray.setFromCamera(ndc, camera);
      return ray.intersectObjects(cards)[0]?.object || null;
    }

    /* ── 커스텀 커서 ── */
    const cursor = document.getElementById('cursor');
    const cursorPos = {x:innerWidth/2, y:innerHeight/2};
    let hovered=null;

    /* ====================== 상세 페이지 전환 ====================== */
    const detail = document.getElementById('detail');
    const bgEl   = detail.querySelector('.bg');
    const heroEl = document.getElementById('hero');
    const heroImg= heroEl.querySelector('img');
    const metaEl = document.getElementById('meta');
    const closeBtn = document.getElementById('close');
    let openMesh = null;

    // 카드의 현재 화면상 사각형(중심 좌표 + 픽셀 크기) 추정
    function cardRect(mesh){
      const wp = new THREE.Vector3(); mesh.getWorldPosition(wp);
      const proj = wp.clone().project(camera);
      const cx = (proj.x*0.5+0.5)*innerWidth;
      const cy = (-proj.y*0.5+0.5)*innerHeight;
      const dist = camera.position.distanceTo(wp);        // 중심에선 사실상 R
      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const h = innerHeight * (CARD_H/(2*dist*Math.tan(vFOV/2)));
      const w = h * (CARD_W/CARD_H);
      return { left:cx-w/2, top:cy-h/2, w, h };
    }
    function heroTarget(){
      const w = Math.min(innerWidth*0.86, 880);
      const h = Math.min(innerHeight*0.82, 1040);
      return { left:(innerWidth-w)/2, top:(innerHeight-h)/2, w, h };
    }

    function splitLines(sel){ // 메타 텍스트를 줄 단위로 감싸 stagger 등장용으로
      return Array.from(metaEl.querySelectorAll(sel));
    }

    function tryOpen(x,y){
      const mesh = pickAt(x,y);
      if(mesh) openDetail(mesh);
    }

    function openDetail(mesh){
      const it = mesh.userData.item;
      openMesh = mesh; locked = true;
      document.getElementById('hint').style.opacity = 0;

      // 텍스트 채우기
      metaEl.querySelector('.cat').textContent = it.cat;
      metaEl.querySelector('h2').textContent = it.title;
      metaEl.querySelector('p').textContent =
        `${it.title} sits among the constellation of works that line this interior horizon. ` +
        `Seen from the centre, every piece faces inward — a quiet field study in how distance, ` +
        `light and motion fold a flat image back onto the curve of a sphere.`;
      metaEl.querySelector('.y').textContent = it.year;
      metaEl.querySelector('.m').textContent = it.medium;
      metaEl.querySelector('.r').textContent = it.ref;
      heroImg.src = it.hi;

      const from = cardRect(mesh);
      const to = heroTarget();
      detail.style.display = 'block';

      // hero 클론을 카드 위치/크기에서 시작
      gsap.set(heroEl, { left:from.left, top:from.top, width:from.w, height:from.h, borderRadius:14, opacity:1 });
      gsap.set(metaEl, { opacity:0 });
      gsap.set(closeBtn,{ opacity:0, y:-6 });

      // 원본 카드는 잠시 숨김(겹침 방지)
      mesh.visible = false;

      const tl = gsap.timeline();
      tl.to(bgEl, { backgroundColor:'rgba(8,8,11,0.96)', backdropFilter:'blur(6px)', duration:0.7, ease:'power2.out' }, 0)
        .to(heroEl, { left:to.left, top:to.top, width:to.w, height:to.h, borderRadius:16,
                      duration:0.85, ease:'expo.inOut' }, 0)
        .to(metaEl, { opacity:1, duration:0.5, ease:'power2.out' }, 0.45)
        .fromTo(splitLines('.cat, h2, p, .row'),
                { y:24, opacity:0 }, { y:0, opacity:1, duration:0.6, stagger:0.07, ease:'power3.out' }, 0.5)
        .to(closeBtn, { opacity:1, y:0, duration:0.4, ease:'power2.out' }, 0.6);
    }

    function closeDetail(){
      if(!openMesh) return;
      const back = cardRect(openMesh);
      const tl = gsap.timeline({ onComplete:()=>{
        detail.style.display='none';
        if(openMesh) openMesh.visible=true;
        openMesh=null; locked=false;
        document.getElementById('hint').style.opacity = 1;
      }});
      tl.to(splitLines('.cat, h2, p, .row'), { y:18, opacity:0, duration:0.3, stagger:0.04, ease:'power2.in' }, 0)
        .to(closeBtn,{ opacity:0, duration:0.25 }, 0)
        .to(metaEl, { opacity:0, duration:0.3 }, 0.05)
        .to(heroEl, { left:back.left, top:back.top, width:back.w, height:back.h, borderRadius:14,
                      duration:0.7, ease:'expo.inOut' }, 0.1)
        .to(bgEl,   { backgroundColor:'rgba(8,8,11,0)', backdropFilter:'blur(0px)', duration:0.6, ease:'power2.in' }, 0.15);
    }
    closeBtn.addEventListener('click', closeDetail);
    addEventListener('keydown', e=>{ if(e.key==='Escape') closeDetail(); });
    bgEl.addEventListener('click', closeDetail);

    /* ====================== 메인 루프 ====================== */
    const focusEl = document.getElementById('focus');
    let introDone = false;
    let frame = 0;

    function tick(){
      requestAnimationFrame(tick);

      // 회전: 관성 + 드리프트 → 목표, 그 목표를 부드럽게 추종
      if(!dragging && !locked){
        rot.tRy += rot.vRy; rot.tRx = clamp(rot.tRx + rot.vRx, -PITCH_LIMIT, PITCH_LIMIT);
        rot.vRy *= FRICTION; rot.vRx *= FRICTION;
        rot.tRy += DRIFT;                         // 손 떼면 천천히 흐른다
      }
      rot.cRx += (rot.tRx - rot.cRx)*EASE;
      rot.cRy += (rot.tRy - rot.cRy)*EASE;
      group.rotation.set(rot.cRx, rot.cRy, 0);

      // 각 카드: 시선 정렬도(alignment)로 깊이감 — 중앙은 또렷, 가장자리는 흐릿
      let best=null, bestA=-1, visible=0;
      const q = group.quaternion;
      for(const m of cards){
        if(!m.visible) continue;
        const wdir = m.userData.dir.clone().applyQuaternion(q); // 카드의 월드 방향
        const align = -wdir.z;                                  // FORWARD(0,0,-1)과의 내적
        m.material.opacity = clamp(align*0.95 + 0.18, 0.08, 1);
        if(introDone){
          const s = 1 + Math.max(0, align)*0.10;                // 중앙일수록 살짝 큼
          m.scale.x += (s - m.scale.x)*0.12;
          m.scale.y += (s - m.scale.y)*0.12;
        }
        if(align>0.55) visible++;
        if(align>bestA){ bestA=align; best=m; }
      }
      if(frame % 6 === 0) focusEl.textContent = visible;

      // 호버 판정(파인 포인터에서만)
      if(!locked && matchMedia('(pointer:fine)').matches){
        const m = pickAt(cursorPos.x, cursorPos.y);
        if(m !== hovered){
          hovered = m;
          cursor.classList.toggle('hot', !!m);
        }
      }

      renderer.render(scene, camera);
      frame++;
    }

    /* ── 리사이즈 ── */
    addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if(openMesh){ const t=heroTarget(); gsap.set(heroEl,{left:t.left,top:t.top,width:t.w,height:t.h}); }
    });

    /* ── 로딩 완료 → 인트로 ── */
    document.getElementById('count').textContent = N;
    const ldNum = document.getElementById('ldNum');
    manager.onProgress = (_u, loaded, total)=>{ ldNum.textContent = Math.round(loaded/total*100)+'%'; };
    manager.onLoad = ()=>{
      const ld = document.getElementById('loader');
      ldNum.textContent = '100%';
      gsap.to(ld, { opacity:0, duration:0.8, onComplete:()=> ld.classList.add('gone') });
      // 카드들이 0에서 팝업되며 등장 (alignment 큰 것부터 느낌나게 무작위 stagger)
      cards.forEach(m=> m.scale.set(0,0,0));
      gsap.to(cards.map(m=>m.scale), {
        x:1, y:1, z:1, duration:1.1, ease:'expo.out',
        stagger:{ each:0.035, from:'random' },
        onComplete:()=>{ introDone = true; }
      });
      // 시작하자마자 살짝 회전 토크를 줘 살아있는 느낌
      rot.vRy = 0.018;
    };
    // 안전장치: 이미지가 끝내 안 와도 8초 뒤 시작
    setTimeout(()=>{ if(!introDone && !document.getElementById('loader').classList.contains('gone')) manager.onLoad(); }, 8000);

    tick();
  </script>
</body>
</html>
