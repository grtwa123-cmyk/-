name: CI

# Every push to a branch with a pull request open was starting two identical
# runs — one for the push, one for the pull request — which is eight jobs
# where four will do. It doubled the compute and, worse, doubled the exposure
# to any check that fails a small fraction of the time: this branch has spent
# the morning reading one runner red and its twin green at the same commit and
# wondering which to believe. Branches are now covered by their pull request,
# and main by its pushes. A branch with no pull request open gets no run,
# which is the trade: work here lands through pull requests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Four runners, a quarter of the suites each. Sequentially the whole thing
    # is about 29 minutes of wall time and climbing, which walked straight
    # into the ceiling below: from the atom commit onward every run was killed
    # at 25 minutes and reported as "cancelled" — the same word that appears
    # when a newer push supersedes a run — so four commits landed without
    # anyone reading it as a failure. A shard is about eight minutes, which
    # puts the ceiling back to being a ceiling.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The project declares no dependencies, so there is nothing to install
      # and no lockfile to cache. Playwright is the one tool the browser half
      # of the suite needs, and it is not in package.json precisely because it
      # is a harness rather than something the site ships.
      - name: Install Chromium for Playwright
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      # tests/smoke.mjs skips its browser section unless CHROMIUM_PATH points
      # at a real binary, so it is resolved here rather than left to chance —
      # a silently skipped browser section would look like a passing run.
      - name: Resolve Chromium
        run: |
          CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          test -x "$CHROMIUM_PATH"
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"

      - name: Test
        run: npm test -- --shard ${{ matrix.shard }}/4
